# Espera PHP unitario, PHP de integración y JavaScript antes de publicar resultados.
codecov:
  notify:
    after_n_builds: 3
comment:
  after_n_builds: 3

# Cobertura mínima exigida tanto al proyecto completo como a cada parche.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0%
        informational: false
    patch:
      default:
        target: 90%
        threshold: 0%
        informational: false
