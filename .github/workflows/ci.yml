name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

  javascript:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # El cliente se instala desde GitHub Packages, que exige autenticarse
      # incluso para paquetes públicos. El salto de línea inicial es necesario:
      # el .npmrc que puede haber dejado setup-node no termina en salto, y un
      # append pegado a la última línea la corrompe.
      - name: Autenticar en GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" >> "${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
      - run: npm ci
      - run: npm run check
      - name: Comprobar bundle versionado
        run: git diff --exit-code -- build
      - name: Validar Blueprint
        run: |
          node -e "JSON.parse(require('fs').readFileSync('blueprint.json'))"
          node -e "JSON.parse(require('fs').readFileSync('blueprint-live.json'))"
