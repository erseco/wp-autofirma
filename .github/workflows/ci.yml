name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

  coverage:
    name: Cobertura de PHP
    runs-on: ubuntu-latest
    # La matriz corre sin instrumentar para no pagar su coste en cada versión:
    # la cobertura se mide una vez y basta con una.
    permissions:
      contents: read
      # Codecov se autentica con OIDC en lugar de con un token guardado como
      # secreto. Sin este permiso no puede emitirse el identificador.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer coverage
      - name: Publicar en Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: php

  javascript:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Los permisos de trabajo sustituyen a los globales, así que hay que
      # repetir el de paquetes: sin él no se puede instalar el cliente.
      packages: read
      # Codecov se autentica con OIDC en lugar de con un token guardado como
      # secreto. Sin este permiso no puede emitirse el identificador.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # El cliente se instala desde GitHub Packages, que exige autenticarse
      # incluso para paquetes públicos. El salto de línea inicial es necesario:
      # el .npmrc que puede haber dejado setup-node no termina en salto, y un
      # append pegado a la última línea la corrompe.
      - name: Autenticar en GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" >> "${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
      - run: npm ci
      - run: npm run check
      # La cobertura no depende de la versión de Node, así que se publica una
      # sola vez en lugar de una por cada entrada de la matriz.
      - name: Publicar en Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          flags: javascript
      - name: Comprobar bundle versionado
        run: git diff --exit-code -- build
      - name: Validar Blueprint
        run: node -e "JSON.parse(require('fs').readFileSync('blueprint.json'))"
