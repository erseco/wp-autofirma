name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer check

  coverage:
    name: Cobertura de PHP
    runs-on: ubuntu-latest
    # La matriz corre sin instrumentar para no pagar su coste en cada versión:
    # la cobertura se mide una vez y basta con una.
    permissions:
      contents: read
      # Codecov se autentica con OIDC en lugar de con un token guardado como
      # secreto. Sin este permiso no puede emitirse el identificador.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer coverage
      - name: Publicar en Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.xml
          flags: php

  integration:
    name: Integración con WordPress
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov se autentica con OIDC en lugar de con un token guardado como
      # secreto. Sin este permiso no puede emitirse el identificador.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      # Las pruebas corren dentro del contenedor, que trae la suite oficial de
      # WordPress. Xdebug en modo cobertura se pide al arrancar: los
      # contenedores no lo llevan activado.
      - name: Levantar wp-env
        run: npx wp-env start --xdebug=coverage
      - name: Ejecutar las pruebas de integración
        run: |
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/wp-autofirma \
            ./vendor/bin/phpunit --configuration=phpunit-integration.xml.dist \
            --coverage-clover=coverage-integration.xml
      # El Plugin Check va en este job porque es el único que tiene a la vez npm
      # (necesario para construir el ZIP), Composer y wp-env ya levantado.
      # Comprueba el paquete distribuible y no el árbol de trabajo, que es lo que
      # de verdad se instala. Los otros tres plugins hermanos ya lo pasaban en CI.
      - name: Pasar el Plugin Check sobre el ZIP
        run: make check-plugin
      - name: Publicar en Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage-integration.xml
          flags: php-integration

  javascript:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov se autentica con OIDC en lugar de con un token guardado como
      # secreto. Sin este permiso no puede emitirse el identificador.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # La cobertura no depende de la versión de Node, así que se publica una
      # sola vez en lugar de una por cada entrada de la matriz.
      - name: Publicar en Codecov
        if: matrix.node == 24
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          flags: javascript
      - name: Comprobar bundle versionado
        run: git diff --exit-code -- build
      - name: Validar Blueprint
        run: node -e "JSON.parse(require('fs').readFileSync('blueprint.json'))"

  bundle:
    # El bundle de `build/` está versionado y se genera a partir de
    # `@erseco/autofirma-client`, así que actualizar esa dependencia lo deja
    # obsoleto: Dependabot toca `package.json` y el `lock`, nunca ejecuta el
    # build. Este job lo regenera y lo empuja a la rama del PR en lugar de
    # obligar a hacerlo a mano.
    name: Regenerar bundle de Dependabot
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Dependabot rebasa sus ramas: sin esto, dos ejecuciones sobre la misma
    # rama competirían por el push y una moriría con un rechazo confuso.
    concurrency:
      group: bundle-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Los scripts de instalación no hacen falta para empaquetar, y son
      # justo el código de la dependencia recién actualizada: no conviene
      # ejecutarlos en un job con permiso de escritura.
      - run: npm ci --ignore-scripts
      # Un push hecho con `GITHUB_TOKEN` no relanza la CI, así que el árbol
      # que se empuja tiene que quedar verificado aquí mismo: `check` pasa
      # formato, pruebas y build antes de tocar la rama.
      - run: npm run check
      - name: Empujar el bundle si ha cambiado
        run: |
          if git diff --quiet -- build; then
            echo 'El bundle versionado ya está al día.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerar bundle tras actualizar dependencias' -- build
          git push
