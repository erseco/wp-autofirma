name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # El cliente se instala desde GitHub Packages, que exige autenticarse
      # incluso para paquetes públicos. El salto de línea inicial es necesario:
      # el .npmrc que puede haber dejado setup-node no termina en salto, y un
      # append pegado a la última línea la corrompe.
      - name: Autenticar en GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: printf '\n//npm.pkg.github.com/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" >> "${NPM_CONFIG_USERCONFIG:-${HOME}/.npmrc}"
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - name: Verificar versiones
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PLUGIN_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' wp-autofirma.php)"
          STABLE_TAG="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt)"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
          test "${PACKAGE_VERSION}" = "${PLUGIN_VERSION}"
          test "${PACKAGE_VERSION}" = "${STABLE_TAG}"
      - run: composer check
      - run: npm run check
      - run: git diff --exit-code -- build
      # `composer install` acaba de regenerar includes/vendor/ desde la versión
      # fijada en composer.lock. Si no coincide con la copia confirmada, alguien
      # la editó a mano o la actualizó sin confirmarla, y el paquete llevaría una
      # librería distinta de la revisada.
      - run: git diff --exit-code -- includes/vendor
      - run: npm run package
      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip --generate-notes
