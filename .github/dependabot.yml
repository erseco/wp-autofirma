# Actualizaciones automáticas de dependencias.
# Referencia: https://docs.github.com/code-security/dependabot
version: 2

updates:
  # Actions usadas por los workflows de CI, documentación y release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # Dependencias JavaScript. El cliente AutoFirma va en su propio grupo porque
  # actualizarlo obliga a regenerar el bundle versionado de `build/`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  # Herramientas PHP de calidad y pruebas: PHPCS, WPCS y PHPUnit.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-development:
        dependency-type: development
