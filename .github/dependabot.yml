# Actualizaciones automáticas de dependencias.
# Referencia: https://docs.github.com/code-security/dependabot
version: 2

updates:
  # Actions usadas por los workflows de CI, documentación y release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # Dependencias JavaScript. El cliente AutoFirma va en su propio grupo porque
  # actualizarlo obliga a regenerar el bundle versionado de `build/`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-production:
        dependency-type: production
      npm-development:
        dependency-type: development

  # Herramientas PHP de calidad y pruebas: PHPCS, WPCS y PHPUnit. Con
  # `composer.lock` versionado, estas actualizaciones llegan como PR revisable
  # en vez de cambiar bajo los pies: una versión nueva de WPCS ya rompió la CI
  # de este repositorio al retirar un sniff que `.phpcs.xml.dist` referenciaba.
  # El `require.php` de composer.json mantiene las propuestas dentro de PHP 7.4.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer-development:
        dependency-type: development
